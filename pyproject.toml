[project]
name = "paper-downloader"
version = "0.1.0"
description = "Download open-access PDFs for papers in a paper list."
readme = "README.md"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "python-dotenv",
    "requests",
]

[project.scripts]
paper-downloader = "paper_downloader.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "responses",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13"]
build-backend = "uv_build"
